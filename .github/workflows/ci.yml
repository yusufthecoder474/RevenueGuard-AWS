
name: RevenueGuard Lambda CI

on:
  push:
  pull_request:

jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: node --check source/index.mjs

      - name: Run Phase 1 tests
        run: node --test test_local.mjs

      - name: Run Phase 2 security tests
        run: node --test test_security.mjs
