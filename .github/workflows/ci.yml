name: RevenueGuard Lambda CI
on:
  push:
  pull_request:
jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check source/index.mjs
      - run: node --test test_local.mjs
